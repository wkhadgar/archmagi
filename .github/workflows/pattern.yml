name: PATTERN

on:
  push:
    paths:
      - 'bin/archmagi'
      - 'bin/archmagi.d/**'
      - 'tests/**'
      - '.github/workflows/pattern.yml'
  pull_request:
    paths:
      - 'bin/archmagi'
      - 'bin/archmagi.d/**'
      - 'tests/**'
      - '.github/workflows/pattern.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install lua (for luac -p syntax checks on .lua files)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.4
          sudo ln -sf /usr/bin/luac5.4 /usr/local/bin/luac
          sudo ln -sf /usr/bin/lua5.4  /usr/local/bin/lua
      - name: tests/smoke.sh
        run: ./tests/smoke.sh
      - name: tests/units.sh
        run: ./tests/units.sh
