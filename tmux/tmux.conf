# RGB: without it tmux quantizes the hex palette to 256 colors.
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"

# Without this, Shift+Enter collapses to Enter inside tmux.
set  -s  extended-keys on

set  -sg escape-time 0
set  -g  focus-events on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set  -g  mouse on
set  -g  base-index 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
set  -g  history-limit 50000
set  -g  set-clipboard on

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g pane-border-style        "fg=#2a2a2a"
set -g pane-active-border-style "fg=#ffbf00"

set -g message-style "fg=#1a1919,bg=#ffbf00,bold"

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#525252,bg=#1a1919"

set -g status-left-length 40
set -g status-left "#[fg=#1a1919,bg=#cc0000,bold] #S #[fg=#cc0000,bg=#1a1919] "

set -g status-right-length 60
set -g status-right "#[fg=#444444]#[fg=#ffbf00] %H:%M #[fg=#cc0000]#[fg=#1a1919,bg=#cc0000,bold]  #H "

setw -g window-status-format         " #I #W "
setw -g window-status-style          "fg=#525252,bg=#1a1919"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style  "fg=#1a1919,bg=#ffbf00,bold"
setw -g window-status-separator      ""
