# MAGI SYSTEM // tmux multiplexer
# Palette mirrors the kitty theme and the zsh prompt:
#   bg #1a1919  red #cc0000  bright-red #ff4444  amber #ffbf00  gray #444444

# --- terminal -------------------------------------------------------------
# tmux-256color carries the correct terminfo; the RGB feature flag tells tmux
# that kitty (TERM=xterm-kitty) speaks 24-bit color, so the hex palette below
# and the prompt's hex segments render true instead of being quantized.
set  -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:extkeys"

# Pass modified keys (Shift+Enter, etc.) through to apps that request them,
# e.g. Claude Code's input box and neovim. Without this tmux collapses
# Shift+Enter back to plain Enter.
set  -s  extended-keys on

# Zero escape delay so ESC is instant in neovim; focus events let nvim autoread.
set  -sg escape-time 0
set  -g  focus-events on

# --- prefix ---------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# --- behavior -------------------------------------------------------------
set  -g  mouse on
set  -g  base-index 1            # windows count from 1
setw -g  pane-base-index 1       # panes count from 1
set  -g  renumber-windows on     # close a window, the rest reflow
set  -g  history-limit 50000
set  -g  set-clipboard on        # copy reaches the system clipboard via kitty OSC52

# --- keybinds -------------------------------------------------------------
# Reload config in place.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits inherit the current pane's directory; | and - match the visual axis.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi copy mode, with wayland-agnostic OSC52 yank.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- theme ----------------------------------------------------------------
set -g pane-border-style        "fg=#2a2a2a"
set -g pane-active-border-style "fg=#ffbf00"

set -g message-style "fg=#1a1919,bg=#ffbf00,bold"

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#525252,bg=#1a1919"

# Session block: the session name in a red block, lit nerd separator after it.
set -g status-left-length 40
set -g status-left "#[fg=#1a1919,bg=#cc0000,bold] #S #[fg=#cc0000,bg=#1a1919] "

# Host and clock on the right.
set -g status-right-length 60
set -g status-right "#[fg=#444444]#[fg=#ffbf00] %H:%M #[fg=#cc0000]#[fg=#1a1919,bg=#cc0000,bold]  #H "

# Inactive windows dim; the active window burns amber.
setw -g window-status-format         " #I #W "
setw -g window-status-style          "fg=#525252,bg=#1a1919"
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style  "fg=#1a1919,bg=#ffbf00,bold"
setw -g window-status-separator      ""
