#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 3
    gaps_out = 10
    border_size = 1

    col.active_border = rgba(cc0000ee) rgba(ffbf00ee) 45deg
    col.inactive_border = rgba(1a0000aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(cc000033)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.2
        new_optimizations = true
    }
}

animations {
    enabled = yes

    # ── HUD SNAP (alternative) ──────────────────────────────────────
    # Sharp, fast, computational. Matches the rofi/consensus aesthetic.
    # To activate: comment out the CRT WARM-UP block and uncomment below.

    bezier = snap,  0.19, 1,   0.22, 1
    bezier = slam,  0.5,  0,   0.5,  1
    bezier = flash, 0,    0,   0.2,  1
    bezier = decel, 0.05, 0.7, 0.1,  1

    animation = global,         1, 5,   default
    animation = border,         1, 1.5, flash
    animation = borderangle,    1, 30,  default, loop
    animation = windows,        1, 2,   slam
    animation = windowsIn,      1, 1.5, decel, popin 90%
    animation = windowsOut,     1, 1,   slam,  popin 90%
    animation = fadeIn,         1, 1,   flash
    animation = fadeOut,        1, 1,   flash
    animation = fade,           1, 1.5, decel
    animation = layers,         1, 2,   snap
    animation = layersIn,       1, 1.5, decel, fade
    animation = layersOut,      1, 1,   flash, fade
    animation = fadeLayersIn,   1, 1,   flash
    animation = fadeLayersOut,  1, 1,   flash
    animation = workspaces,     1, 2,   slam,  slide
    animation = workspacesIn,   1, 2,   slam,  slide
    animation = workspacesOut,  1, 1.5, flash, slide

}

dwindle {
    preserve_split = true
    smart_split = true
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    font_family = "JetBrains Mono"
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    allow_session_lock_restore = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}
